backend:
  name: github
  repo: snakajima-ops/kaneko-e-website
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "site"
    label: "サイト編集"
    files:
      - name: "works"
        label: "工事実績"
        file: "content/works.json"
        fields:
          - label: "実績一覧"
            name: "items"
            widget: "list"
            label_singular: "実績"
            summary: "{{title}}"
            fields:
              - { label: "タイトル", name: "title", widget: "string" }
              - { label: "説明", name: "description", widget: "text" }
              - { label: "写真（任意）", name: "image", widget: "image", required: false }
      - name: "jobs"
        label: "採用情報（募集職種）"
        file: "content/jobs.json"
        fields:
          - label: "求人一覧"
            name: "items"
            widget: "list"
            label_singular: "求人"
            summary: "{{title}}"
            fields:
              - { label: "雇用形態タグ", name: "tag", widget: "string", default: "正社員" }
              - { label: "職種名", name: "title", widget: "string" }
              - { label: "説明", name: "description", widget: "text" }
      - name: "clients"
        label: "主な取引先"
        file: "content/clients.json"
        fields:
          - label: "取引先一覧"
            name: "items"
            widget: "list"
            label_singular: "取引先"
            summary: "{{name}}"
            fields:
              - { label: "名称", name: "name", widget: "string" }

      - name: "news"
        label: "お知らせ"
        file: "content/news.json"
        fields:
          - label: "お知らせ一覧"
            name: "items"
            widget: "list"
            label_singular: "お知らせ"
            summary: "{{date}} {{title}}"
            fields:
              - { label: "日付", name: "date", widget: "datetime", format: "YYYY.MM.DD", date_format: "YYYY.MM.DD", time_format: false }
              - { label: "タイトル", name: "title", widget: "string" }
              - { label: "本文（段落を分けるときは1行空けてください）", name: "body", widget: "text" }
              - label: "写真（任意・1枚目が大きく表示されます）"
                name: "images"
                widget: "list"
                required: false
                label_singular: "写真"
                fields:
                  - { label: "画像", name: "image", widget: "image" }
                  - { label: "説明文（任意）", name: "caption", widget: "string", required: false }
